<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Investment Purchase Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Investment Purchase Tracker</h1>
    </header>
    <main>
        <section id="login-panel">
            <h2>Account</h2>
            <form id="auth-form">
                <label for="email">Email</label>
                <input id="email" type="email" required>
                
                <label for="password">Password</label>
                <input id="password" type="password" minlength="8" maxlength="128" required>
                
                <button id="login-button" type="submit">Log in</button>
                <button id="register-button" type="button">Register</button>
            </form>
        </section>
        <section id="tracker-panel" hidden>
            <p id="account-status"></p>
            <button id="logout-button" type="button">Log out</button>
            <h2>Purchase</h2>
            <form id="purchase-form" novalidate>
                <label for="investment-name">Investment name</label>
                <input id="investment-name" maxlength="100" required>

                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" min="1" max="10000" step="1" required>

                <label for="unit-price">Unit price in USD</label>
                <input id="unit-price" type="number" min="0.01" max="1000000" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" required></select>

                <button id="save-button" type="submit">Add purchase</button>
                <button id="cancel-edit" type="button">Cancel edit</button>
            </form>
            
            <h2>Summary</h2>
            <p>Total invested: <span id="total-invested">$0.00</span></p>
            <p>Purchases: <span id="purchase-count">0</span></p>
            <h2>History</h2>
            <ul id="purchase-list"></ul>
            <p id="message" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>

</html>
